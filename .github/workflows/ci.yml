name: Verify
on:
  # PR branches are verified by their pull_request run; push covers main only.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest release, so the deployed engine always has current Go security
          # fixes. go.mod's `go` line is the minimum supported toolchain.
          go-version: stable
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make fmt-check vet
      # Engine wasm, license notices, typecheck, bundle, and the dist/ check.
      - run: make dist NPM_INSTALL="npm ci"
      # With dist/ built, this includes the CLI/WASM parity and bundle identity checks.
      - run: make test-go
      - run: make test-web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Runs against the production build in web/dist, under the production CSP.
      - run: npx playwright test
        working-directory: web
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  # Safari's engine, which every iOS browser also uses. Standard macOS runners
  # are free for public repositories. Runs web/e2e/webkit.spec.ts only.
  webkit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npx playwright install webkit
      - run: make test-webkit NPM_INSTALL="npm ci"

  # Publishes the exact build that passed `check` (and `webkit`). Hosting is managed in
  # iwvelando/cloud-accounts (sites/moneypath.isaacvelando.com). Only this job
  # can get AWS credentials, and the `production` environment only allows main.
  deploy:
    needs: [check, webkit]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://moneypath.isaacvelando.com
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      DEPLOY_ROLE_ARN: arn:aws:iam::634753796535:role/moneypath-deploy
      BUCKET: moneypath-site-634753796535
      DISTRIBUTION_ID: E3I2R28PEC93FP
      SITE_URL: https://moneypath.isaacvelando.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # `sync --delete` below would wipe the site if the build came out empty.
      - name: sanity-check build
        run: |
          for f in index.html 404.html favicon.svg apple-touch-icon.png og-image.png; do test -s "dist/$f"; done
          ls dist/assets/*.js
          test "$(find dist/assets -name '*.wasm' | wc -l)" -eq 1
          test "$(stat -c %s dist/assets/*.wasm)" -gt 1000000

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fingerprinted assets first, so the new index.html never references a missing
      # file. Old assets are kept for pages that were already open during a deploy.
      # The engine gets its content type explicitly: CloudFront compresses only
      # types it recognises, and streaming compilation needs application/wasm.
      - name: upload
        run: |
          aws s3 sync dist/assets/ "s3://$BUCKET/assets/" --exclude '*.wasm' \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync dist/assets/ "s3://$BUCKET/assets/" --exclude '*' --include '*.wasm' \
            --content-type application/wasm --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync dist/ "s3://$BUCKET/" --delete --exclude 'assets/*' \
            --cache-control 'public, max-age=300'

      - name: invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: check headers
        run: |
          header() { curl -fsSI "$SITE_URL$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2-; }
          if [ "$(header / content-security-policy)" != "$(tr -d '\n' < deploy/content-security-policy.txt)" ]; then
            echo "::error::The live CSP differs from deploy/content-security-policy.txt. Update iwvelando/cloud-accounts to match."
            exit 1
          fi
          wasm=$(cd dist && find assets -name '*.wasm')
          test "$(header "/$wasm" content-type)" = application/wasm
          curl -fsS "$SITE_URL/" | grep -q '<title>moneypath</title>'

  # A real browser against the live site, after the deploy. No AWS credentials.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @smoke
        env:
          BASE_URL: https://moneypath.isaacvelando.com

  # Runs on main started by a workflow (e.g. Dependabot merges) notify no one, so a
  # failure on main opens an issue, or comments on the one already open.
  alert:
    needs: [check, webkit, deploy, smoke]
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Production deploy failed
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - run: |
          body="Verify run $RUN_URL failed on main at $SHA. The live site may be stale or broken. Fix forward, or revert the change and let it redeploy."
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "$TITLE" --body "$body"; fi

description: Optimizer adjusts an infeasible expense amount to the largest affordable spending against the emergency-fund floor, which is the chosen plan's own emergency-fund target. The chosen amount lands on a whole cent, snapped up so the reported headroom is the headroom the plan actually has.
normative: true
optimize: true
tolerance: 0.01
expectedMetrics:
  - scenario: base plan
    emergencyFund:
      targetMonths: 3.00
      averageMonthlyExpenses: 1912.82
      targetAmount: 5738.46
      initialLiquid: 5000.00
      fundedMonths: 2.6139
      shortfall: 738.46
      surplus: 0.00
    optimizations:
      - targetName: New expense
        field: amount
        original: -500.00
        value: -225.64
        originalDisplay: "-$500.00"
        valueDisplay: "-$225.64"
        floor: 5738.46
        minimumCash: 5738.48
        headroom: 0.02
        iterations: 15
        converged: true

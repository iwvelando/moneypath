description: >
  Growth, in a plan starting mid-year with an inflation rate of 3 %. Every
  amount that grows steps in June, on the plan's anniversaries, and holds as
  written through its first year: a salary at its own 4 %, a rent and a roof
  repair (a one-off in the plan's fourth year) with inflation, a phone bill
  fixed, a subscription shrinking 10 % a year, a contribution at 4 % and a
  withdrawal with inflation. A loan's escrow and its yearly extra payment
  follow inflation: the refund at the payoff in 2028-10 is the escrow billed
  that year, at both years' amounts, and every December after it bills twelve
  times that December's escrow. A cash floor that tracks inflation has its
  tightest month where its margin is least, not where cash is: in June 2027
  on "grows" and June 2028 on "fixed", against January 2027 for the fixed
  floor. The option that sets every growth back to fixed changes nothing in
  the first year, so both scenarios have the same emergency-fund target. The
  inactive scenario is not run. With the inflation rate set, each scenario's
  columns gain liquid and total in 2026-06 dollars, and every guardrail keeps
  its months, its margin converted at its tightest month. In today's dollars cash is lowest in 2028-01 on "grows"
  and 2028-09 on "fixed", not in 2027-01.
normative: true
optimize: false
tolerance: 0.01

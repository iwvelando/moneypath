version: 2
simulation:
  startDate: 2025-06
  endDate: 2026-12
  startingCash: 6000.00
guardrails:
  - name: Brokerage keeps 30000
    kind: lasts
    investments: [Brokerage]
    amount: 30000.00
scenarios:
  - name: brokerage payoff
    events:
      - name: Income
        amount: 3600.00
        optimize:
          field: amount
          min: 2600
          max: 3600
          guardrail: Brokerage keeps 30000
      - name: Spending
        amount: -2600.00
    loans:
      - name: House loan
        principal: 60000.00
        interestRate: 4.00
        term: 180
        startDate: 2023-01
        earlyPayoffThreshold: 5000.00
    investments:
      - name: Brokerage
        startingValue: 45000.00
        annualReturnRate: 6.00
        withdrawalTaxRate: 15.00
        fundLoanPayoffs: true

description: >
  Liabilities and net worth, in a plan with an inflation rate of 3 %. Both
  paths share a student loan that began in 2021-07, which owes $14,468.65
  after its payment in the first month. "own and sell" also has a mortgage
  that began in 2019-01, sold by date in 2027-09, and a car loan that starts
  in 2026-06, so it owes nothing before then, and is paid off by threshold in
  2027-10. Its total passes that of "rent and invest" in 2026-12, but its net
  worth, which subtracts the mortgage, only in the sale month. After the car's
  payoff both paths owe only the student loan, so their net worth differs by
  what their totals do. The CSV is what it is without liabilities, which it
  does not carry.
normative: true
optimize: false
tolerance: 0.01

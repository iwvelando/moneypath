description: >
  Today's dollars, in a plan with an inflation rate of 3 % that grows nothing,
  so every nominal figure is what the plan computes without the rate. Each
  scenario's columns gain liquid and total in 2026-01 dollars. "steady" keeps
  $25,000.00 in cash throughout: nominal, its lowest cash is in the start
  month, and in today's dollars it is in the last. "bonus later" is lowest
  nominally in 2026-03 and in today's dollars in 2027-05, the month before the
  bonus, and it overtakes "steady" in 2027-06 in both readings. A cash floor
  that tracks inflation breaks in 2028-01, when its margin is converted at
  that anniversary. The car's debt-free breaks in 2028-06 with $4,500.00 owed,
  converted at that month. The optimizer's emergency-fund target on "spend"
  converts its floor, lowest cash and headroom at the month of that lowest
  cash, the last month, and keeps its chosen amount as written. The
  emergency-fund figures read the same in both.
normative: true
optimize: true
tolerance: 0.01
expectedMetrics:
  - scenario: steady
    keyFigures: {lowestCash: 25000.00, lowestCashDate: "2026-01", endingCash: 25000.00, endingTotal: 25000.00}
    guardrails:
      - {name: Cushion, kind: cashFloor, result: breaks, firstBreachDate: "2028-01", tightestDate: "2028-01", margin: -461.60}
      - {name: Car gone by mid-2028, kind: debtFree, result: holds, tightestDate: "2026-01", marginMonths: 29}
    todaysDollars:

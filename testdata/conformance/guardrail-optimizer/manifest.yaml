description: >-
  The optimizer-amount case with guardrails added. The CSV and the optimizer's
  choice, held to its own emergency-fund floor, are exactly those of the plan
  without guardrails, and the guardrails are read from the final forecast: the
  chosen expense leaves 5738.48 in the last month, which a floor of that amount
  from 2025-05 exactly meets (with the expense as written it would break),
  while the start month's 5200.00 breaks a 5500 floor.
normative: true
optimize: true
tolerance: 0.01
expectedMetrics:
  - scenario: base plan
    emergencyFund:
      targetMonths: 3.00
      averageMonthlyExpenses: 1912.82
      targetAmount: 5738.46
      initialLiquid: 5000.00
      fundedMonths: 2.6139
      shortfall: 738.46
      surplus: 0.00
    optimizations:
      - targetName: New expense
        field: amount
        original: -500.00
        value: -225.64
        originalDisplay: "-$500.00"
        valueDisplay: "-$225.64"
        floor: 5738.46
        minimumCash: 5738.48
        headroom: 0.02
        iterations: 15
        converged: true
    guardrails:
      - {name: Hold what the optimizer leaves, kind: cashFloor, result: holds, tightestDate: "2026-12", margin: 0.00}
      - {name: Never below 5500, kind: cashFloor, result: breaks, firstBreachDate: "2025-01", tightestDate: "2025-01", margin: -300.00}

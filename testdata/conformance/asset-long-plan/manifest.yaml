description: >
  Assets over twelve years at 3 % inflation. The house follows inflation, so it
  reads 450,000.00 in today's dollars in every month it is held. Its mortgage
  matures in 2035-05; escrow is billed each December while the house is held,
  and the sale in 2037-03 bills three months of it and no December after. The
  car, bought for cash, loses 15 % a year from 2030-01; the cabin, bought in
  2032-07 with a loan secured on it, gains 2.5 %. Both purchases charge
  nothing beyond the cash the plan writes for them. By cash, selling leads from
  the sale on; by net worth, keeping does.
normative: true

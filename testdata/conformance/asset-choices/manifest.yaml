description: >
  A plan with choices in which an option sells the house by changing the asset.
  At 2031-01 selling is 72,523.81 ahead by total but 86,692.44 behind by net
  worth: the house's appreciation, the selling costs and the rent. In the sale
  month, 2027-06, the house sells for 312,829.23 with 18,769.75 in costs, and
  the sale clears the mortgage for the debt-free guardrail. The baseline asset
  appears in every path, so every scenario has the balance-sheet columns.

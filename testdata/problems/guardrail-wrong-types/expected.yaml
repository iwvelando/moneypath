description: >
  A guardrail's amount is a number. A value of the wrong kind is placed at its
  field, and the plan is refused.
problems:
  - level: error
    path: guardrails.0.amount
    where: Guardrail “Cushion”
    message: This must be a number.
  - level: error
    path: guardrails.1.amount
    where: Guardrail “Overdraft”
    message: This must be a number.

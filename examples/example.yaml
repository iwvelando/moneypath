# moneypath example configuration (format v2)
# Copy and adapt. Field-by-field reference: spec/03-config-v2.md
# For scenarios that pick options instead of repeating entries, see choices.yaml.
version: 2

simulation:
  # Optional; when omitted the simulation starts at the current month.
  startDate: 2025-06
  # Required; the simulation runs through this month, inclusive.
  endDate: 2090-01
  # Required; cash balance as of the end of the month before startDate.
  startingCash: 30000.00
  # Optional; the APR your cash earns, compounded monthly (4.0 yields about 4.07%
  # a year, the APY a bank would advertise). Default 0 (cash
  # in an account that pays nothing). Try 4.0 to model a high-yield savings
  # account. Enter it after tax; only positive cash earns it.
  cashInterestRate: 0
  # Optional; how much prices rise each year, in percent (2.5 means prices are
  # 2.5% higher a year later). Default 0. It changes nothing on its own: only
  # an amount with `growth: inflation` follows it. Rates above stay nominal.
  inflationRate: 2.5

recommendations:
  # Months of average expenses to target for the emergency-fund
  # recommendation. 0 disables it. Default: 6.
  emergencyFundMonths: 6

# Everything under `common` is shared by every scenario.
common:
  events:
    # Positive amounts are income, negative amounts are spending. Amounts are
    # written in the start month's prices.
    - name: Social security
      amount: 1000.00
      # Optional; how the amount changes over the years: fixed (the default),
      # inflation (follows inflationRate) or a yearly percent such as 3. It
      # steps once a year, on the anniversaries of the simulation's startDate,
      # counted from that start whenever the event itself starts.
      growth: inflation
      frequency: 1        # every month (default)
      startDate: 2050-01  # begins here; defaults to the simulation start
    - name: Service quarterly bill
      amount: -10.00
      frequency: 3        # every 3 months
    - name: Streaming subscription
      amount: -35.00      # monthly (frequency defaults to 1)
  loans:
    - name: Auto loan
      asset: Car              # the asset this loan is secured on (see assets below)
      principal: 30000.00     # original principal before the down payment
      downPayment: 5000.00    # paid at startDate
      interestRate: 3.1       # APR (annual percentage rate)
      term: 72                # months
      startDate: 2020-01      # may predate the simulation window
  investments:
    - name: Brokerage account
      startingValue: 25000.00
      annualReturnRate: 6.5   # APR, compounded monthly (about 6.70% a year)
      taxRate: 15.0           # percent of positive monthly growth (tax drag)
      withdrawalTaxRate: 15.0 # percent of the growth portion of withdrawals
      fundLoanPayoffs: true   # let this account's after-tax value count toward (and
                              # fund) early-payoff thresholds; taxable accounts only
      contributions:
        - amount: 500.00
          frequency: 1
          startDate: 2025-07
      withdrawals:
        # Withdrawals use a fixed amount OR a percentage of the balance —
        # one style per investment.
        - amount: 2000.00
          frequency: 12
          startDate: 2035-12
          endDate: 2065-12
    - name: Retirement drawdown
      startingValue: 500000.00
      annualReturnRate: 5.0
      withdrawals:
        - percentage: 4.0     # percent of the current balance (after monthly growth)
          frequency: 12
          startDate: 2035-01
          endDate: 2065-12

  # Assets are things owned that have a value but no cash flow until they are
  # sold. Their value counts toward net worth, never toward liquid or total.
  assets:
    - name: Car
      value: 16000.00         # worth this in its first month in the plan
      appreciation: -15       # yearly percent, drifting month by month; fixed
                              # (default), inflation, or a number like this one

scenarios:
  - name: current path
    active: true              # default true; set false to skip a scenario
    events:
      - name: Income
        amount: 1234.56
        endDate: 2050-01      # defaults to the simulation end when omitted
      - name: Transition income
        amount: 2000.00
        startDate: 2050-02
        # Optional optimizer directive: with --optimize (or the web UI
        # toggle) this field is adjusted to keep cash above the
        # emergency-fund floor. See spec/04-engine-semantics.md §7.
        optimize:
          field: startDate
          minDate: 2049-10
          maxDate: 2050-06
      - name: Bonus
        amount: 7891.23
        # startDate == endDate makes this a one-time event.
        startDate: 2025-12
        endDate: 2025-12
    loans:
      - name: 1234 Street Address
        principal: 150000.00
        downPayment: 10000.00
        interestRate: 3.75
        term: 360
        startDate: 2018-01
        # Monthly escrow added to each payment. If the loan ends without the
        # property being sold, 12x escrow is paid every December afterward
        # (property costs continue after payoff).
        escrow: 500.00
        # Property tax and insurance usually rise: let the escrow follow
        # inflation (or a yearly percent of its own). Default fixed.
        escrowGrowth: inflation
        # Monthly mortgage insurance, charged while remaining/original
        # principal exceeds the cutoff percentage.
        mortgageInsurance: 50.00
        mortgageInsuranceCutoff: 78.0
        # Pay the loan off early in the month the running cash balance
        # exceeds the remaining principal by at least this amount.
        earlyPayoffThreshold: 5000.00
    investments:
      - name: Retirement savings
        startingValue: 15000.00
        annualReturnRate: 7.0
        # true: contributions come out of simulated cash (post-tax money,
        # e.g. Roth/brokerage). false/omitted: funded outside the simulation
        # (e.g. pre-tax payroll deduction).
        contributionsFromCash: true
        contributions:
          - amount: 750.00
            growth: 3         # 3% more each year, like the pay it comes from
            startDate: 2025-07

  - name: sell and downsize
    events:
      - name: Income
        amount: 1234.56
        endDate: 2050-01
    loans:
      - name: 1234 Street Address
        principal: 150000.00
        downPayment: 10000.00
        interestRate: 3.75
        term: 360
        startDate: 2018-01
        escrow: 500.00
        mortgageInsurance: 50.00
        mortgageInsuranceCutoff: 78.0
        # Pay off at a fixed date and sell the property.
        earlyPayoffDate: 2026-06
        sellProperty: true
        sellPrice: 195000.00    # defaults to `principal` when omitted
        sellCostsNet: 9500.00   # positive = closing costs paid at sale
      - name: 5678 Street Address
        asset: Smaller home     # secured on the asset listed below
        principal: 200000.00
        downPayment: 40000.00
        interestRate: 2.75
        term: 360
        startDate: 2026-06
        escrow: 600.00
        earlyPayoffThreshold: 5000.00
        # Extra principal payments accept the full event shape.
        extraPrincipalPayments:
          - amount: 100.00            # monthly extra principal
          - name: large one-off payment
            amount: 19000.00
            startDate: 2027-06
            endDate: 2027-06
    investments:
      - name: Retirement savings
        startingValue: 15000.00
        annualReturnRate: 7.0
        contributionsFromCash: true
        contributions:
          - amount: 750.00
            startDate: 2025-07
    assets:
      # Bought when its loan starts. The down payment is the loan's; the
      # asset itself charges nothing. With a sellDate it would be sold at its
      # value then, paying off the loans secured on it (sellCosts: a percent).
      - name: Smaller home
        value: 200000.00
        appreciation: inflation
        startDate: 2026-06
